name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Ruff
      run: ruff check --output-format=github python_magnetgeo tests

    - name: Bandit
      run: bandit -c pyproject.toml -r python_magnetgeo

    # non-blocking until the existing type diagnostics are fixed
    - name: ty
      run: ty check --output-format github
      continue-on-error: true
