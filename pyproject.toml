[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-magnetgeo"
version = "1.0.1"
description = "Python helpers to create HiFiMagnet cads and meshes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Christophe Trophime", email = "christophe.trophime@lncmi.cnrs.fr"},
    {name = "Romain Vallet", email = "romain.vallet@lncmi.cnrs.fr"},
    {name = "Jeremie Muzet", email = "jeremie.muzet@lncmi.cnrs.fr"}
]
maintainers = [
    {name = "Christophe Trophime", email = "christophe.trophime@lncmi.cnrs.fr"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["magnet", "geometry", "cad", "mesh", "simulation", "hifimagnet"]
dependencies = [
    "pyyaml>=6.0.2,<7.0.0",
    "pandas>=1.5.3",
    "xlwt>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.16.0",
    "ty>=0.0.85",
    "bandit[toml]>=1.9.0",
    "pre-commit>=4.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-autodoc-typehints>=1.22.0",
    "myst-parser>=0.18.0",
]
test = [
    "pytest>=8.2.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/MagnetDB/python_magnetgeo"
Documentation = "https://python-magnetgeo.readthedocs.io"
Repository = "https://github.com/MagnetDB/python_magnetgeo"
Issues = "https://github.com/MagnetDB/python_magnetgeo/issues"
Changelog = "https://github.com/MagnetDB/python_magnetgeo/blob/main/HISTORY.md"

[project.scripts]
load-profile-from-dat = "python_magnetgeo.examples.load_profile_from_dat:main"
split-helix-yaml = "python_magnetgeo.examples.split_helix_yaml:main"
check-magnetgeo-yaml = "python_magnetgeo.examples.check_magnetgeo_yaml:main"
compress-hcut = "python_magnetgeo.examples.compress_hcut:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["python_magnetgeo*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
python_magnetgeo = ["py.typed"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=python_magnetgeo",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests for individual classes",
    "integration: Integration tests across multiple classes",
    "serialization: Tests for JSON/YAML serialization",
    "geometric: Tests for geometric operations",
    "probe: Tests for probe system functionality",
    "slow: Tests that take longer to run",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
branch = true
source = ["python_magnetgeo"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# Black code formatter
[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort import sorter
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# Ruff linter (alternative to flake8)
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["python_magnetgeo"]

# ty type checker
[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["python_magnetgeo"]

[tool.ty.analysis]
# matplotlib is an optional, lazily imported dependency;
# importlib_metadata is only a fallback for old Pythons
allowed-unresolved-imports = ["matplotlib.**", "importlib_metadata"]

# Bandit security linter
[tool.bandit]
exclude_dirs = [
    "tests",
    "tests.old",
    "docs",
    "build",
    ".venv",
    "venv",
    ".tox",
]
# importing subprocess is not an issue by itself; actual calls are checked by B602/B603
skips = ["B404"]
